name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MapIt.sln

      - name: Build
        run: dotnet build MapIt.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MapIt.sln --no-build --configuration Release --verbosity normal
