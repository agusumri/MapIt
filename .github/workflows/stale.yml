name: Stale

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned,security'
          stale-issue-message: >
            This issue has been inactive for 60 days and is now marked as stale.
            Comment to keep it open, otherwise it will be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 60 days and is now marked as stale.
            Push a commit or comment to keep it open, otherwise it will be closed in 14 days.
          close-issue-message: >
            Closing after 14 days of inactivity since being marked stale. Feel free to reopen.
          close-pr-message: >
            Closing after 14 days of inactivity since being marked stale. Feel free to reopen.
